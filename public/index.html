<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enfactum Card Generator - Static A5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui-container">
        <h2 style="color: white; font-family: sans-serif;">Enfactum Card Creator</h2>

    <img id="baseImage" src="assets/EidCard.png" style="display:none;" alt="Card Template">
