<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summit Card Generator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #1a1a1a; display: flex; flex-direction: column; align-items: center; }
        #ui-container {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            margin: 20px;
            border: 1px solid #333;
        }
        input, button { display: block; width: 100%; margin: 10px 0; padding: 12px; box-sizing: border-box; border-radius: 5px; border: none; }
        #recorderCanvas { width: 100%; max-width: 500px; height: auto; background: #000; margin-top: 10px; border: 2px solid #444; }
    </style>
</head>
<body>

    <div id="ui-container">
        <h2 style="color: white; font-family: sans-serif;">Summit Card Creator</h2>
        <input type="text" id="employeeName" placeholder="Enter Full Name...">
        
        <div style="text-align: left; color: white; font-family: sans-serif; font-size: 13px;">
            <label>Upload Secondary Logo:</label>
            <input type="file" id="logoUpload" accept="image/*">
        </div>

        <button id="recordBtn" style="background: #fff; font-weight: bold; cursor: pointer;">Personalize & Download</button>
    </div>

    <canvas id="recorderCanvas"></canvas>

    <img id="baseImage" src="assets/EidCard.jpg" style="display:none;">

    <script src="script.js"></script>
</body>
</html>
